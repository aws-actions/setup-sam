name: "Tests"
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  native-installer:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04-arm
    name: Native installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Test official installer (pinned version)
        uses: ./
        with:
          use-installer: true
          version: "1.104.0"
      - run: sam --version | grep -F 1.104.0

      - name: Test official installer (pinned version; no published digest, so uncached)
        uses: ./
        id: installer-pinned-cached
        with:
          use-installer: true
          version: "1.104.0"
      - run: sam --version | grep -F 1.104.0

      - name: Test official installer (latest version)
        uses: ./
        with:
          use-installer: true
      - run: |
          version=$(curl https://pypi.org/pypi/aws-sam-cli/json | jq -r .info.version)
          sam --version | grep -F "$version"
        shell: bash

      # A version with a published SHA256 digest can be cached, so the second
      # invocation must restore it and pass integrity verification. This is the
      # only coverage of the verified cache-hit path against the real cache
      # service; unit tests mock @actions/cache and cannot exercise it.
      - name: Test verified cache (cold)
        uses: ./
        id: cache-cold
        with:
          use-installer: true
          version: "1.166.2"
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sam --version | grep -F 1.166.2

      - name: Test verified cache (warm; must hit cache)
        uses: ./
        id: cache-warm
        with:
          use-installer: true
          version: "1.166.2"
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sam --version | grep -F 1.166.2
      - name: Assert cache was used
        run: |
          echo "cold cache-hit=${{ steps.cache-cold.outputs.cache-hit }}"
          echo "warm cache-hit=${{ steps.cache-warm.outputs.cache-hit }}"
          test "${{ steps.cache-warm.outputs.cache-hit }}" = "true"

      # 1.104.0 predates published asset digests, so it cannot be verified and
      # must therefore never be served from the cache.
      - name: Assert unverifiable version does not use the cache
        run: test "${{ steps.installer-pinned-cached.outputs.cache-hit }}" != "true"

  integ:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-22.04
          - ubuntu-24.04-arm
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    name: PyPI / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Set SAM versions based on Python version
      SAM_VERSION: ${{ contains(fromJson('["3.12", "3.13"]'), matrix.python) && '1.128.0' || '1.18.2' }}
      INSTALLER_VERSION: ${{ contains( matrix.os, '-arm') && '1.130.0' || '1.71.0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Test official installer (pinned version)
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./
        with:
          use-installer: true
          version: ${{ env.INSTALLER_VERSION }}
      - if: startsWith(matrix.os, 'ubuntu')
        run: sam --version | grep -F ${{ env.INSTALLER_VERSION }}

      - name: Test official installer (latest version)
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./
        with:
          use-installer: true
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          version=$(curl https://pypi.org/pypi/aws-sam-cli/json | jq -r .info.version)
          sam --version | grep -F "$version"
        shell: bash

      # Test setup specific version
      - uses: ./
        with:
          version: ${{ env.SAM_VERSION }}
      - run: sam --version | grep -F ${{ env.SAM_VERSION }}

      # Test setup latest version
      - uses: ./
      - run: |
          version=$(curl https://pypi.org/pypi/aws-sam-cli/json | jq -r .info.version)
          sam --version | grep -F "$version"
        shell: bash

      # Test sam init
      - run: sam init --name sam-app --runtime nodejs20.x --dependency-manager npm --app-template hello-world

      # Test sam build
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: sam build
        working-directory: ./sam-app

      # Test sam build --use-container
      # Doesn't work as-is on macOS or Windows due to licensing:
      # - https://github.com/actions/runner-images/issues/17
      # - https://github.com/actions/runner-images/issues/1143
      # Ubuntu ARM runners are not yet GA
      - if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.os, '-arm')
        run: sam build --use-container
        working-directory: ./sam-app
